# Kalshi quote logger (research/kalshi/PLAN.md): runs after every "Update CBB card" run and logs Kalshi's public
# spread and total quotes for the card's BET / WATCH games to research/kalshi/data/. Research only: no alerts, posts
# or stakes; never touches the card, bets/, lines/ or any frozen file.
name: Kalshi quotes

on:
  workflow_run:
    workflows: ["Update CBB card"]
    types: [completed]
    branches: [claude/college-basketball-model-nmztcl]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kalshi-quotes
  cancel-in-progress: false

jobs:
  log:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/college-basketball-model-nmztcl     # the card run's own commit is on the branch head
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Log Kalshi quotes
        run: python -m research.kalshi.logger
      - name: Save the log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          if [ -d research/kalshi/data ]; then git add -A -- research/kalshi/data; fi
          git diff --cached --quiet || git commit -m "Kalshi quotes ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          # retry: another job may push between this job's pull and push; fail only if every try fails
          ok=0
          for i in 1 2 3 4 5 6; do
            if git pull --rebase -X theirs origin claude/college-basketball-model-nmztcl && git push origin HEAD:claude/college-basketball-model-nmztcl; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 4))
          done
          [ "$ok" = 1 ]
