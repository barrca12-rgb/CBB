# Second-half line pilot (cbb/research_h2.py --pilot): historical second-half lines at halftime for 100 games of
# 2025-26, at most 2,400 credits. Runs when data/research/h2_pilot_request.txt changes, or from the Actions tab.
name: Research pull (second-half pilot)

on:
  workflow_dispatch:
  push:
    branches: [claude/college-basketball-model-nmztcl, main]
    paths:
      - "data/research/h2_pilot_request.txt"

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Pull second-half lines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m cbb.research_h2 --pilot
      - name: Save the result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A data/research
          git diff --cached --quiet || git commit -m "Research: second-half pilot lines ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          # retry: another job may push between this job's pull and push; fail only if every try fails
          ok=0
          for i in 1 2 3 4 5 6; do
            if git pull --rebase -X theirs origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 4))
          done
          [ "$ok" = 1 ]
