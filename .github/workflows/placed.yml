# Placed button on the card (cbb/report_html.py): records a bet Chad placed. Marks it placed in bets/bets.csv and
# records the book, line, odds, stake and time in bets/accepted.csv (cohort C). Never changes a pick or the record's
# grading. Started from the card with the browser's GitHub token, or from the Actions tab.
name: Record placed bet

on:
  workflow_dispatch:
    inputs:
      bet_id:
        description: "Bet id (date|game_id|market|side), from the card"
        required: true
      book:
        description: "Book the bet was placed at"
        required: true
      line:
        description: "Line taken (spread from your side, or the total)"
        required: true
      odds:
        description: "American odds taken, e.g. -110"
        required: true
      stake:
        description: "Units"
        required: true
      placed_at:
        description: "When it was placed (ISO time; blank = now)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: placed-bets
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/college-basketball-model-nmztcl
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install pandas
      - name: Record the bet
        env:
          BET_ID: ${{ github.event.inputs.bet_id }}
          BOOK: ${{ github.event.inputs.book }}
          LINE: ${{ github.event.inputs.line }}
          ODDS: ${{ github.event.inputs.odds }}
          STAKE: ${{ github.event.inputs.stake }}
          PLACED_AT: ${{ github.event.inputs.placed_at }}
        run: |
          if [ -n "$PLACED_AT" ]; then
            python -m cbb.placed --bet-id "$BET_ID" --book "$BOOK" --line "$LINE" --odds "$ODDS" --stake "$STAKE" --placed-at "$PLACED_AT"
          else
            python -m cbb.placed --bet-id "$BET_ID" --book "$BOOK" --line "$LINE" --odds "$ODDS" --stake "$STAKE"
          fi
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add bets/bets.csv bets/accepted.csv
          git diff --cached --quiet || git commit -m "Placed: $BET_ID"
          # retry: another job may push between this job's pull and push; fail only if every try fails
          ok=0
          for i in 1 2 3 4 5 6; do
            if git pull --rebase -X theirs origin claude/college-basketball-model-nmztcl && git push origin HEAD:claude/college-basketball-model-nmztcl; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 4))
          done
          [ "$ok" = 1 ]
        env:
          BET_ID: ${{ github.event.inputs.bet_id }}
