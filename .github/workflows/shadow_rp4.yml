# Roster-prior shadow (research/roster_prior/SHADOW_PLAN.md): runs after every "Update CBB card" run, prices the card's
# saved stage-2 inputs with the current model and with the F2 blended prior (its own stage 2), and logs each
# version's plays to bets/shadow_rp4/. No alerts, posts or stakes; never touches bets/bets.csv, the card or any
# frozen file.
name: Shadow roster prior

on:
  workflow_run:
    workflows: ["Update CBB card"]
    types: [completed]
    branches: [claude/college-basketball-model-nmztcl]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shadow-rp4
  cancel-in-progress: false

jobs:
  shadow:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/college-basketball-model-nmztcl     # the card run's own commit is on the branch head
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt scikit-learn scipy
      - uses: actions/cache@v4
        with:
          path: cbb/cache
          key: shadow-rp4-${{ github.run_id }}
          restore-keys: shadow-rp4-
      - name: Run the shadow
        run: python -m cbb.shadow_rp4
      - name: Save the shadow log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          if [ -d bets/shadow_rp4 ]; then git add -A -- bets/shadow_rp4; fi
          git diff --cached --quiet || git commit -m "Shadow rp4 ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          git checkout -- . 2>/dev/null || true      # leave nothing else changed before the rebase
          ok=0
          for i in 1 2 3 4 5 6 7 8; do
            if git pull --rebase -X theirs origin claude/college-basketball-model-nmztcl && git push origin HEAD:claude/college-basketball-model-nmztcl; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          [ "$ok" = 1 ]
