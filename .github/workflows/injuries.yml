# Injury check between card runs (cbb/injury_watch.py): every 10 minutes from cron-job.org (workflow_dispatch).
# Does real work only when a game tips within 2 hours; then pulls every injury source and alerts on news for teams
# we have open bets on. Saves the injury logs back to the repo.
name: Injury check

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: injury-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: cbb/cache
          key: injury-check-${{ github.run_id }}
          restore-keys: injury-check-

      - name: Check injuries
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m cbb.injury_watch

      - name: Save the injury logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A injuries
          git diff --cached --quiet || git commit -m "Injury check ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          git pull --rebase -X theirs origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"
