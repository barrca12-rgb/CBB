# Results-only refresh of the site (cbb/live_refresh.py; Chad, Nov 2). Runs after every targeted quote poll (every 3
# minutes): ESPN's free scoreboard -> live scores and the game clock, finished plays graded with the card's own grader,
# the record tiles, the record page -> publish. No odds pull of any kind (no Odds API credits), no model run, no new
# play, and nothing is committed: the bet log, Discord results and phone alerts stay with the 10-minute card run. No
# Discord or phone secret is passed, so nothing here can post or alert.
name: Live results refresh

on:
  workflow_run:
    workflows: ["Targeted quote poll"]
    types: [completed]
    branches: [claude/college-basketball-model-nmztcl]
  workflow_dispatch:

permissions:
  contents: read
  actions: read        # to see whether a card run is publishing (below)
  pages: write
  id-token: write

concurrency:
  # renamed Nov 10: run 42671566948 (Nov 9, 18:09 UTC) hung in "waiting" and held the old "live-refresh" group, so
  # every refresh after it queued behind it and was cancelled by the next one; no refresh published for 27 hours
  group: live-refresh-v2
  cancel-in-progress: false   # never cancel a refresh mid-publish (Nov 3: "Unable to find artifact" failures)

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/college-basketball-model-nmztcl     # the newest card on the branch head
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Scores, results and record
        id: live
        run: python -m cbb.live_refresh

      # the same site as the card run's "Build site" step (.github/workflows/update.yml); a test keeps the two equal
      - name: Build site
        if: steps.live.outputs.publish == 'true'
        run: |
          mkdir -p _site
          cp reports/cbb_*.html reports/days.json reports/record.html _site/ 2>/dev/null || true
          CUR=$(python -c "import json; print('cbb_' + json.load(open('reports/days.json'))['current'] + '.html')" 2>/dev/null || true)
          if [ -n "$CUR" ] && [ -f "reports/$CUR" ]; then cp "reports/$CUR" _site/index.html
          else echo '<!doctype html><meta charset="utf-8"><title>CBB card</title><p>No card yet.</p>' > _site/index.html; fi
          mkdir -p _site/assets && cp site/assets/* _site/assets/   # Off The Glass logo, banner, icons, link-preview image
          mkdir -p _site/record && if [ -d site/record ]; then cp -r site/record/. _site/record/; fi   # weekly charts (cbb/record_chart.py)
          if [ -f reports/verify.html ]; then cp reports/verify.html _site/record/verify.html; fi      # unlisted verification page
          touch _site/.nojekyll

      # a card run that saved a newer card meanwhile publishes it itself: never put an older card back up. GitHub Pages
      # takes one publish at a time, so the refresh also stands aside while a card run is going (Nov 3: card runs at
      # 04:50, 08:50 and 12:50 UTC failed with "in progress deployment" while a refresh was publishing)
      - name: Skip if a newer card was saved or a card run is publishing
        id: fresh
        if: steps.live.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q --depth=1 origin claude/college-basketball-model-nmztcl
          busy=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/update.yml/runs?per_page=5" \
            | python -c "import sys, json; print(sum(r['status'] != 'completed' for r in json.load(sys.stdin)['workflow_runs']))" \
            || echo 0)
          if ! git diff --quiet HEAD FETCH_HEAD -- reports; then echo "A newer card was saved; it publishes itself."; echo "ok=false" >> "$GITHUB_OUTPUT"
          elif [ "$busy" != "0" ]; then echo "A card run is going; it publishes the site itself."; echo "ok=false" >> "$GITHUB_OUTPUT"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/upload-pages-artifact@v3
        if: steps.live.outputs.publish == 'true' && steps.fresh.outputs.ok == 'true'
        with:
          path: _site

      # a refresh is best effort: the next one is 3 minutes away, so a GitHub-side publish hiccup (Nov 3, 05:00 UTC:
      # "Failed to get ID Token: socket hang up") is logged here, never a failed run
      - id: deploy
        if: steps.live.outputs.publish == 'true' && steps.fresh.outputs.ok == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v4
