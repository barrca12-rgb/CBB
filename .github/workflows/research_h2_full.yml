# Second-half full test: historical second-half spreads at halftime for 510 games of 2023-24 to 2025-26 (spreads
# only, about 10 credits a game), at most 6,500 credits. Runs when data/research/h2_full_request.txt changes, or from the Actions tab.
name: Research pull (second-half full test)

on:
  workflow_dispatch:
  push:
    branches: [claude/college-basketball-model-nmztcl, main]
    paths:
      - "data/research/h2_full_request.txt"

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Pull second-half lines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          H2_GAMES: data/research/h2_full_games.csv
          H2_OUT: data/research/h2_full_lines.csv
          H2_MARKETS: spreads_h2
          H2_CAP: "6500"
        run: python -m cbb.research_h2 --pilot
      - name: Save the result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A data/research
          git diff --cached --quiet || git commit -m "Research: second-half full-test lines ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          git pull --rebase -X theirs origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"
