# First-half test option A (research/market/h1_pull.py): first-half spreads and totals at tip - 15 minutes for
# 576 games of 2025-26, at most 11,700 credits. Runs when research/market/h1_a_request.txt changes, or from
# the Actions tab.
name: Research pull (first-half option A)

on:
  workflow_dispatch:
  push:
    branches: [claude/college-basketball-model-nmztcl, main]
    paths:
      - "research/market/h1_a_request.txt"

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Pull first-half lines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m research.market.h1_pull
      - name: Save the result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A research/market/data
          git diff --cached --quiet || git commit -m "Research: first-half option A lines ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          git pull --rebase -X theirs origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"
