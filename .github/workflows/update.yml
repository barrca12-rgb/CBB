# Builds the daily CBB bet card with live lines and publishes it to GitHub Pages (barrca12-rgb.github.io/CBB/).
# Triggered by the "Update now" button on the page, from the Actions tab, by code changes, or on the schedule below.
name: Update CBB card

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Card date YYYY-MM-DD (blank = today, or tomorrow after 8pm ET)"
        required: false
        default: ""
      test_alert:
        description: "Also send a test phone alert"
        type: boolean
        default: false
  push:                     # rebuild the site when the page or model code changes
    branches: [claude/college-basketball-model-nmztcl, main]
    paths:
      - "cbb/**.py"
      - "data/projection.json"
      - ".github/workflows/update.yml"
  schedule:                 # October-April only (UTC times; ET = UTC-5 in season). 12 runs a day: every 2 hours in
                            # the daytime, hourly in the evening when next-day openers post. Each run also builds a
                            # card for every later day that already has lines. About 200 SGO entities a run, well
                            # inside the Rookie plan's 100,000 a month; odds.py stops pulling at 95% of the month.
    - cron: "37 12 * 10,11,12,1,2,3,4 *"   # 7:37 am ET: last night's box scores in, morning lines
    - cron: "37 15,17,19,21 * 10,11,12,1,2,3,4 *"   # 10:37 am, 12:37, 2:37, 4:37 pm ET (FanMatch out by late morning)
    - cron: "7 23 * 10,11,12,1,2,3,4 *"    # 6:07 pm ET: before the evening tips
    - cron: "37 0,1,2,3,4,5 * 10,11,12,1,2,3,4 *"   # 7:37 pm to 12:37 am ET, hourly: tomorrow's openers as they post

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-cbb-card
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # KenPom, Barttorvik and hoopR downloads; past seasons never change, current ones are refreshed by the run
      - uses: actions/cache@v4
        with:
          path: cbb/cache
          key: cbb-${{ github.run_id }}
          restore-keys: cbb-

      - name: Build the card with live lines
        env:
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
          KENPOM_API_KEY: ${{ secrets.KENPOM_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}   # second line source (cbb/odds_api.py); optional
          ODDS_API_EVERY_RUN: "1"                    # paid plan (20K credits/month): pull on all 12 runs
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}     # phone alerts for new BETs (cbb/notify.py); optional
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}   # public record channel (cbb/record.py); optional
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then python -m cbb.run_day --date "${{ github.event.inputs.date }}"
          else python -m cbb.run_day --auto; fi
          if [ "${{ github.event.inputs.test_alert }}" = "true" ]; then python -m cbb.notify; fi

      - name: Build site
        run: |
          mkdir -p _site
          cp reports/cbb_*.html reports/days.json reports/record.html _site/ 2>/dev/null || true
          CUR=$(python -c "import json; print('cbb_' + json.load(open('reports/days.json'))['current'] + '.html')" 2>/dev/null || true)
          if [ -n "$CUR" ] && [ -f "reports/$CUR" ]; then cp "reports/$CUR" _site/index.html
          else echo '<!doctype html><meta charset="utf-8"><title>CBB card</title><p>No card yet.</p>' > _site/index.html; fi
          touch _site/.nojekyll

      # Timestamp the bet log (OpenTimestamps, free, no account): a new proof whenever bets.csv changed, and each run
      # upgrades the current proof once a Bitcoin block confirms it. Older proofs stay in git history.
      - name: Timestamp the bet log
        continue-on-error: true
        run: |
          pip install -q opentimestamps-client
          if [ -f bets/bets.csv ] && { ! git diff --quiet -- bets/bets.csv || [ ! -f bets/bets.csv.ots ]; }; then
            rm -f bets/bets.csv.ots && ots stamp bets/bets.csv
          elif [ -f bets/bets.csv.ots ]; then
            ots upgrade bets/bets.csv.ots || true
            rm -f bets/bets.csv.ots.bak
          fi

      - name: Save the card and lines to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          mkdir -p reports lines
          mkdir -p bets
          mkdir -p injuries
          git add -A reports lines bets injuries data/barttorvik_preseason_*.csv
          git diff --cached --quiet || git commit -m "Update CBB card ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          # if a push landed meanwhile, keep this run's freshly built card and lines on any conflict
          # retry: another job may push between this job's pull and push; fail only if every try fails
          ok=0
          for i in 1 2 3 4 5 6; do
            if git pull --rebase -X theirs origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 4))
          done
          [ "$ok" = 1 ]

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
