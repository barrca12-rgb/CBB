# Builds the daily CBB bet card with live lines and publishes it to GitHub Pages (barrca12-rgb.github.io/CBB/).
# Triggered by the "Update now" button on the page, from the Actions tab, by code changes, or on the schedule below.
name: Update CBB card

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Card date YYYY-MM-DD (blank = today, or tomorrow after 8pm ET)"
        required: false
        default: ""
  push:                     # rebuild the site when the page or model code changes
    branches: [claude/college-basketball-model-nmztcl, main]
    paths:
      - "cbb/**.py"
      - "data/projection.json"
      - ".github/workflows/update.yml"
  schedule:                 # November-April only (UTC times; ET = UTC-5 in season)
    - cron: "37 12 * 11,12,1,2,3,4 *"   # 7:37 ET: last night's box scores in, morning lines
    - cron: "37 16 * 11,12,1,2,3,4 *"   # 11:37 ET: KenPom FanMatch for today is out
    - cron: "7 21 * 11,12,1,2,3,4 *"    # 4:07 ET: before the evening tips
    - cron: "37 1 * 11,12,1,2,3,4 *"    # 8:37 ET: tomorrow's openers

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-cbb-card
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # KenPom, Barttorvik and hoopR downloads; past seasons never change, current ones are refreshed by the run
      - uses: actions/cache@v4
        with:
          path: cbb/cache
          key: cbb-${{ github.run_id }}
          restore-keys: cbb-

      - name: Build the card with live lines
        env:
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
          KENPOM_API_KEY: ${{ secrets.KENPOM_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then python -m cbb.run_day --date "${{ github.event.inputs.date }}"
          else python -m cbb.run_day --auto; fi

      - name: Build site
        run: |
          mkdir -p _site
          cp reports/cbb_*.html reports/days.json _site/ 2>/dev/null || true
          CUR=$(python -c "import json; print('cbb_' + json.load(open('reports/days.json'))['current'] + '.html')" 2>/dev/null || true)
          if [ -n "$CUR" ] && [ -f "reports/$CUR" ]; then cp "reports/$CUR" _site/index.html
          else echo '<!doctype html><meta charset="utf-8"><title>CBB card</title><p>No card yet.</p>' > _site/index.html; fi
          touch _site/.nojekyll

      - name: Save the card and lines to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          mkdir -p reports lines
          git add -A reports lines
          git diff --cached --quiet || git commit -m "Update CBB card ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
