# One-off research pulls that spend The Odds API credits (not part of the daily card).
# Team totals: real historical team-total lines for 2025-26 candidate games (cbb/research_team_totals.py).
# Runs from the Actions tab (with a credit cap) or when data/research/tt_request.txt changes. Resumes where it stopped.
name: Research pull (team totals)

on:
  workflow_dispatch:
    inputs:
      cap:
        description: "Most credits this run may spend"
        required: false
        default: "10500"
  push:
    branches: [claude/college-basketball-model-nmztcl, main]
    paths:
      - "data/research/tt_request.txt"

permissions:
  contents: write

concurrency:
  group: research-team-totals
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Pull historical team totals
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TT_CAP: ${{ github.event.inputs.cap || '10500' }}
        run: python -m cbb.research_team_totals

      - name: Save results to the repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A data/research
          git diff --cached --quiet || git commit -m "Research: historical team-total lines ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          # retry: another job may push between this job's pull and push; fail only if every try fails
          ok=0
          for i in 1 2 3 4 5 6; do
            if git pull --rebase -X theirs origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 4))
          done
          [ "$ok" = 1 ]
