# One-off check (cbb/research_h2.py): does The Odds API have college basketball second-half lines? Spends at most
# 150 credits. Runs from the Actions tab or when data/research/h2_request.txt changes.
name: Research check (second-half lines)

on:
  workflow_dispatch:
  push:
    branches: [claude/college-basketball-model-nmztcl, main]
    paths:
      - "data/research/h2_request.txt"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Check second-half markets
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m cbb.research_h2
      - name: Save the result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A data/research
          git diff --cached --quiet || git commit -m "Research: second-half line check ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          git pull --rebase -X theirs origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"
